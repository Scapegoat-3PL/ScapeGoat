name: Rate Card Editor — Cloudflare Preview Smoke Check
on:
  pull_request:
    paths:
      - 'quote-editor/**'
      - 'wrangler.jsonc'
      - '.github/workflows/quote-editor-cloudflare-smoke.yml'
  workflow_dispatch:
jobs:
  cloudflare-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify dedicated Worker serves the editor (not the original Scapegoat homepage)
        shell: bash
        run: |
          set -eu
          URL='https://scapegoatquoteeditor.sean-0a8.workers.dev/?demo=1'
          echo "Checking $URL"
          RESPONSE=$(curl -sSL --max-time 20 -w '\nSTATUS:%{http_code}' "$URL" || true)
          STATUS=${RESPONSE##*STATUS:}
          BODY=${RESPONSE%STATUS:*}
          echo "Cloudflare HTTP status: $STATUS"
          if [[ "$STATUS" == "200" ]] && grep -Fq 'SCAPEGOAT.OS | Edit Opportunity Quote' <<< "$BODY"; then
            echo 'EDITOR_PREVIEW_AVAILABLE=yes'
          else
            echo 'EDITOR_PREVIEW_AVAILABLE=no'
            echo 'Deployment likely stale, wrong Git branch, unavailable or access-protected.'
          fi
          # Diagnostics only: do not break source-code CI while Cloudflare
          # deploys from Git asynchronously or staging access is restricted.
      - name: Verify all browser module assets are deployed
        shell: bash
        run: |
          set -eu
          BASE='https://scapegoatquoteeditor.sean-0a8.workers.dev'
          for ASSET in quote-editor.js quote-editor-core.mjs quote-release.mjs n5-proposal-renderer.mjs; do
            STATUS=$(curl -sSL --max-time 15 -o /tmp/scapegoat-asset -w '%{http_code}' "$BASE/$ASSET" || true)
            echo "Asset $ASSET HTTP $STATUS"
            if [[ "$STATUS" != "200" ]]; then
              echo "::error::Missing browser asset: $ASSET"
              exit 1
            fi
          done
      - name: Check backend route is not mistakenly returning the static homepage
        shell: bash
        run: |
          STATUS=$(curl -sS -L --max-time 20 -o /tmp/scapegoat-health -w '%{http_code}' 'https://scapegoatquoteeditor.sean-0a8.workers.dev/health' || true)
          echo "Cloudflare /health HTTP status: $STATUS"
          if grep -Eq '"(ok|error)"' /tmp/scapegoat-health 2>/dev/null; then
            echo 'API_ROUTE_RESPONDS_AS_JSON=yes'
          else
            echo 'API_ROUTE_RESPONDS_AS_JSON=no'
            echo 'Worker routing may not be deployed or database secrets not yet configured.'
          fi

      - name: Check no-extra-project Supabase Edge Function health
        shell: bash
        run: |
          set -eu
          URL='https://dtmeaqjtreawxnlzkenq.supabase.co/functions/v1/scapegoat-quote-editor/health'
          CODE=$(curl -sSL --max-time 18 -o /tmp/sg-edge-health -w '%{http_code}' "$URL" || true)
          echo "Supabase Edge health HTTP $CODE"
          cat /tmp/sg-edge-health || true
          echo
          if [[ "$CODE" != '200' ]]; then
            echo 'EDGE_FUNCTION_HEALTH=not_ready'
            exit 1
          fi
          echo 'EDGE_FUNCTION_HEALTH=ok'
